# Bundle wrapper for the Android mobile adaptation layer.
#
# The responsive layer is a client-only plugin. The plugin manager lists bundles, and a bare
# client row inserted directly by the profile patch has no bundle card; this package is the
# managed bundle that contributes the existing row, so "installed plugins" can show and toggle it.
#
# The second row loads this package's own client bundle, which carries the phone-only visual
# tweaks (model trigger width, compact stats, no reference checkboxes).
- insert:
    - id: ui-responsive
      name: "@dsh-android/dsh-client-ui-responsive"
    - id: mobile-tweaks
      name: "@dsh-android/dsh-client-ui-responsive-bundle"
