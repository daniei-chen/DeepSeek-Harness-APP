name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 0.11.0"
        required: true
      notes:
        description: "Release notes (optional)"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DSH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DSH_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::DSH_KEYSTORE_BASE64 is not set — the APK will be unsigned."
          fi

      - name: Build
        env:
          DSH_VERSION_NAME: ${{ steps.version.outputs.value }}
          DSH_KEYSTORE_PASSWORD: ${{ secrets.DSH_KEYSTORE_PASSWORD }}
          DSH_KEY_ALIAS: ${{ secrets.DSH_KEY_ALIAS }}
          DSH_KEY_PASSWORD: ${{ secrets.DSH_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Check versionCode increased
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK" | head -1)
          echo "$BADGING"
          CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ "$NAME" != "${{ steps.version.outputs.value }}" ]; then
            echo "versionName mismatch: $NAME"; exit 1
          fi
          test "$CODE" -gt 31934

      - name: Name artifact
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          OUT="DeepSeek-Harness-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          gh release create "v$VERSION" "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --title "DeepSeek Harness $VERSION" \
            --notes "${{ inputs.notes || '' }}" \
            --latest

      - name: Refresh latest.json
        continue-on-error: true
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          node setup/make-latest-json.mjs --version "$VERSION" --apk "${{ steps.apk.outputs.path }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "chore: update manifest for $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
