name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: Host plugin and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test combined-plugin/test/*.test.mjs setup/lib.test.mjs
      - name: Installer dry run
        run: node setup/dsh-mobile-setup.mjs install --dry-run --json --profile desktop --file-root "$HOME" > /tmp/plan.json && node -e "const p=require('/tmp/plan.json'); if(!p.bundles.includes('@dsh-android/deepseek-harness-app-plugin')) process.exit(1)"

  app:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
