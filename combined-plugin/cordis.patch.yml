# DeepSeek Harness APP 插件
#
# One host plugin contributes:
# - /dsh-file-ops (Android workspace file panel)
# - /dsh-mobile/info (Settings -> 手机访问 status)
# - BrowserSkill browser_* tools
# The client bundle in lib/client.js adds the Android WebView adaptation layer.
- insert:
    - id: deepseek-app
      name: "@dsh-android/deepseek-harness-app-plugin"
    - id: ui-responsive
      name: "@dsh-android/dsh-client-ui-responsive"
